<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        var myInt;
        function myData(){
            document.getElementById("demo").innerHTML+="Harshu!";
        }

        function myStart(){
            myInt=setInterval(myData,500);
        }

        function myStop(){
            clearInterval(myInt);
        }


    </script>
</head>
<body bgcolor="lightblue">
    <button onclick="myStart()"> Click Here </button>
    <button onclick="myStop()"> Stop </button>
    
    <h1 id="demo"> Harshu! </h1>
</body>
</html>
