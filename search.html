<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Find Triangle Area</h2>

Base: <input id="base"><br><br>
Height: <input id="height"><br><br>

<button onclick="findArea()">Calculate</button>

<p id="result"></p>

<script>
    function findArea() {
        let b = document.getElementById("base").value;
        let h = document.getElementById("height").value;

        let area = (b * h) / 2;

        document.getElementById("result").innerHTML = 
            "Area is: " + area;
    }
</script>
</body>
</html>
